name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers uses the Docker engine that ubuntu-latest already has
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # job logs need a login, so put the failing tests where anyone can see them
      - name: Show failed tests
        if: failure()
        run: |
          for f in $(grep -l -E "<<< (FAILURE|ERROR)" backend/target/surefire-reports/*.txt backend/target/failsafe-reports/*.txt seat-simulator/target/surefire-reports/*.txt 2>/dev/null); do
            echo "::error title=$(basename "$f" .txt)::$(grep -m1 -A3 -E '<<< (FAILURE|ERROR)' "$f" | tr '\n' ' ' | cut -c1-900)"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
