# BACKEND_UPSTREAM is the URL of the API (http://backend:8080 in Compose, an https URL on a
# host that puts the two services on different machines). The nginx image fills it in at
# start-up from the environment, so the same image runs anywhere.
server {
    listen 80;
    root /usr/share/nginx/html;

    # same origin for the page and the API, so no CORS and the refresh cookie works
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_ssl_server_name on;
        # the API sees the upstream's own host and no Origin, so the call counts as same-origin
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # server-sent events: no buffering and a long read timeout
    location ~ ^/api/v1/activities/[^/]+/seats$ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # client-side routes like /activities/123 all serve the app
    location / {
        try_files $uri /index.html;
    }
}
