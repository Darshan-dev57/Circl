# Local infrastructure for Circl.
#   docker compose up -d                 -> only Postgres and Redis (run the backend from your IDE)
#   docker compose --profile app up -d   -> also builds and runs the backend
# Values come from .env (copy .env.example). The defaults below are for local dev only.
name: circl

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: circl-postgres
    # JIT compile time was bigger than the whole nearby query
    command: ["postgres", "-c", "jit=off"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-circl}
      POSTGRES_USER: ${POSTGRES_USER:-circl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circl}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-circl} -d ${POSTGRES_DB:-circl}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: circl-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [app]
    build: ./backend
    container_name: circl-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-circl}
      DB_USER: ${POSTGRES_USER:-circl}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-circl}
      REDIS_HOST: redis
      # DEV ONLY fallbacks, put real secrets (32+ characters) in .env
      CIRCL_JWT_SECRET: ${CIRCL_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      CIRCL_CHECKIN_SECRET: ${CIRCL_CHECKIN_SECRET:-dev-only-checkin-secret-change-me-0123456789}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
