# Local infrastructure for Circl.
#   docker compose up -d                 -> only Postgres, Redis and Kafka (run the backend from your IDE)
#   docker compose --profile app up -d   -> also builds the backend and the frontend (http://localhost:3000)
# Values come from .env (copy .env.example). The defaults below are for local dev only.
name: circl

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: circl-postgres
    # JIT compile time was bigger than the whole nearby query
    command: ["postgres", "-c", "jit=off"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-circl}
      POSTGRES_USER: ${POSTGRES_USER:-circl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circl}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-circl} -d ${POSTGRES_DB:-circl}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: circl-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # single Kafka node in KRaft mode (no ZooKeeper). Port 9092 is for the host, 19092 for other containers.
  # No volume on purpose: Postgres (the outbox) is the source of truth, Kafka only carries events.
  kafka:
    image: apache/kafka:3.9.1
    container_name: circl-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  backend:
    profiles: [app]
    build: ./backend
    container_name: circl-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-circl}
      DB_USER: ${POSTGRES_USER:-circl}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-circl}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # DEV ONLY fallbacks, put real secrets (32+ characters) in .env
      CIRCL_JWT_SECRET: ${CIRCL_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      CIRCL_CHECKIN_SECRET: ${CIRCL_CHECKIN_SECRET:-dev-only-checkin-secret-change-me-0123456789}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    profiles: [app]
    build: ./frontend
    container_name: circl-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
