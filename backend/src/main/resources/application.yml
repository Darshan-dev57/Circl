spring:
  application:
    name: nearmeet
  datasource:
    # dev defaults match docker-compose.yml; set DB_URL / DB_USER / DB_PASSWORD anywhere else
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nearmeet}
    username: ${DB_USER:nearmeet}
    password: ${DB_PASSWORD:nearmeet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
