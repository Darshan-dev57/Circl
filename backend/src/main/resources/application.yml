spring:
  application:
    name: circl
  datasource:
    # dev defaults match docker-compose.yml; set DB_URL / DB_USER / DB_PASSWORD anywhere else
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circl}
    username: ${DB_USER:circl}
    password: ${DB_PASSWORD:circl}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    type: ${CACHE_TYPE:redis}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        # fail fast when the broker is down, the outbox keeps the event for the next try
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.darshan.circl.common.outbox.ActivityEvent
        spring.json.use.type.headers: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

circl:
  jwt:
    # DEV ONLY default so the app starts on a laptop. Set CIRCL_JWT_SECRET (32+ bytes) everywhere else.
    secret: ${CIRCL_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: circl
    access-ttl: 15m
    refresh-ttl: 7d
  auth:
    # turn on (COOKIE_SECURE=true) when the app is served over https
    cookie-secure: ${COOKIE_SECURE:false}
  checkin:
    # DEV ONLY default, set CIRCL_CHECKIN_SECRET (32+ bytes) everywhere else
    secret: ${CIRCL_CHECKIN_SECRET:dev-only-checkin-secret-change-me-0123456789}
    opens-before: 30m
    grace-after-start: 15m
  attendance:
    finalize-after-end: 2h
    appeal-window: 48h
  availability:
    max-minutes: 180
    max-radius-km: 5
    min-reliability-to-search: 40
    searches-per-window: 10
    search-window: 5m
    max-jump-km: 5
  events:
    topic: circl.activity-events
    partitions: 3
  join:
    strategy: ${CIRCL_JOIN_STRATEGY:CONDITIONAL_UPDATE}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
